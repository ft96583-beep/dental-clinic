<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Intercept and allow window.fetch assignments via a custom configurable getter/setter
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get: function() { return _fetch; },
          set: function(v) { _fetch = v; },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        try {
          let _fetch = Window.prototype.fetch;
          Object.defineProperty(Window.prototype, 'fetch', {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e2) {}
      }

      // Global error interceptor to catch and suppress any assignment errors
      window.addEventListener('error', function(event) {
        if (event.message && (event.message.includes('fetch') || event.message.includes('Cannot set property'))) {
          event.preventDefault();
          event.stopPropagation();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(event) {
        if (event.reason && event.reason.message && event.reason.message.includes('fetch')) {
          event.preventDefault();
        }
      });

      // Safe global Proxy
      try {
        window.global = new Proxy(window, {
          set(target, prop, value) {
            try {
              target[prop] = value;
            } catch (e) {}
            return true;
          }
        });
      } catch (e) {
        window.global = window;
      }
    </script>
